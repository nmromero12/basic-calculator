<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic-Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="myscript.js" defer></script>
    <div class="calculator-container">
        <div class="display-container">
            <div class="display-box"></div>
        </div>
        <div class="button-container">
            <button>AC</button>
            <button>DEL</button>
            <button>^</button>
            <button>&divide;</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>&times;</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button class="zero">0</button>
            <button>.</button>
            <button>=</button>

        </div>
    </div>
    
</body>
</html>
